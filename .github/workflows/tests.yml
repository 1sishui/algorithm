name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JS 自测
        run: |
          for f in test/*.mjs; do
            echo "== $f"
            node "$f"
          done

      - name: Python 语法与单测
        run: |
          python -m py_compile serve.py server/*.py
          python -m unittest discover -s test -p "test_*.py" -v