<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算法学习智能体 · 原型 v0.1（离线版）</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #111a2b;
  --panel-2: #16213a;
  --line: #223049;
  --text: #e6edf7;
  --muted: #8497b3;
  --blue: #38bdf8;
  --amber: #f59e0b;
  --red: #ef4444;
  --green: #22c55e;
  --purple: #a78bfa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}

.app {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 350px;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "top top top"
    "side stage right";
  height: 100vh;
}

.topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.brand { display: flex; align-items: baseline; gap: 10px; font-size: 16px; }
.tag {
  font-size: 11px;
  color: var(--blue);
  border: 1px solid rgba(56, 189, 248, .4);
  border-radius: 999px;
  padding: 1px 8px;
}

.panel {
  background: var(--panel);
  overflow-y: auto;
  padding: 16px;
}
.sidebar { grid-area: side; border-right: 1px solid var(--line); }
.right { grid-area: right; border-left: 1px solid var(--line); }

.panel h2 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--muted);
  text-transform: uppercase;
}
.panel section + section { margin-top: 22px; }

.badge {
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
  margin-left: 4px;
  letter-spacing: 0;
  text-transform: none;
}

/* ---------- 知识图谱 ---------- */
.kg-group { margin-bottom: 12px; }
.kg-group > .kg-cat {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}
.kg-node {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
  padding: 3px 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.kg-node:hover { background: var(--panel-2); }
.kg-node.active { background: rgba(56, 189, 248, .12); color: var(--blue); }
.kg-node .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); flex: none;
}
.kg-node.done .dot { background: var(--green); }
.kg-node .pct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- 主舞台 ---------- */
.stage {
  grid-area: stage;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 22px;
  min-width: 0;
  overflow-y: auto;
}

.toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.toolbar label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}
.toolbar .grow { flex: 1; min-width: 200px; }

input[type="text"], input:not([type]), select, textarea {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 10px;
  font: inherit;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); }

button {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 14px;
  font: inherit;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--blue); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: rgba(56, 189, 248, .14); border-color: rgba(56, 189, 248, .5); color: var(--blue); }

/* ---------- 柱状图 ---------- */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 340px;
  padding: 0 4px 22px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.bar {
  flex: 1;
  min-width: 2px;
  background: #2b4a6f;
  border-radius: 3px 3px 0 0;
  position: relative;
  transition: height .12s linear, background .12s linear;
}
.bar.sorted { background: #2f6b4a; }
.bar.compare { background: var(--amber); }
.bar.pivot { background: var(--red); }
.bar.swap { background: var(--purple); }
.bar span {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: -20px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.player { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.player input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--blue); }
.speed { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.speed input { width: 90px; }

.note {
  margin: 0;
  padding: 10px 14px;
  background: var(--panel);
  border-left: 3px solid var(--blue);
  border-radius: 4px;
  color: #c9d6e8;
  min-height: 22px;
}

.metrics { display: flex; gap: 24px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.metrics b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }

/* ---------- 右侧 ---------- */
.mastery-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.mastery-row .name { width: 76px; font-size: 12px; color: var(--muted); flex: none; }
.mastery-row .track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.mastery-row .fill { height: 100%; background: linear-gradient(90deg, #2563eb, var(--blue)); }
.mastery-row .val { width: 30px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.recommend {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 13px;
}
.recommend .kp { color: var(--blue); font-weight: 600; }
.recommend .why { color: var(--muted); font-size: 12px; margin-top: 4px; }

textarea {
  width: 100%;
  height: 90px;
  resize: vertical;
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 12px;
  margin-bottom: 8px;
}

.diagnosis { margin-top: 10px; font-size: 13px; }
.diagnosis .row { margin-bottom: 8px; }
.diagnosis .k { color: var(--muted); font-size: 11px; display: block; }
.diagnosis .type { color: var(--red); font-weight: 600; }
.diagnosis .q { color: var(--amber); }
.diagnosis pre {
  background: #0a1020;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 11px;
  overflow-x: auto;
  color: #9fb3cc;
}

.muted { color: var(--muted); font-size: 12px; }

@media (max-width: 1180px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 56px auto auto auto;
    grid-template-areas: "top" "stage" "side" "right";
    height: auto;
  }
  .sidebar { border-right: 0; border-top: 1px solid var(--line); }
  .right { border-left: 0; border-top: 1px solid var(--line); }
}
/* ---------- 诊断：来源标记与加载态 ---------- */
.diag-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.src {
  font-size: 11px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  white-space: nowrap;
}
.src-llm { color: var(--blue); border-color: rgba(56, 189, 248, .5); background: rgba(56, 189, 248, .1); }
.src-rules { color: var(--muted); }
.fallback { font-size: 11px; color: var(--amber); line-height: 1.4; }
.diag-loading { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.spinner {
  width: 12px; height: 12px; flex: none;
  border-radius: 50%;
  border: 2px solid var(--line);
  border-top-color: var(--blue);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.diag-error { color: var(--amber); font-size: 13px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details pre { margin-top: 6px; }

/* ---------- 诊断操作区与连接自检 ---------- */
.diag-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.diag-actions button { flex: 1; }
.health {
  display: none;
  font-size: 12px;
  line-height: 1.7;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
  margin-bottom: 10px;
  word-break: break-all;
}
.health.good { display: block; border-color: rgba(34, 197, 94, .45); color: #86efac; }
.health.bad { display: block; border-color: rgba(245, 158, 11, .45); color: #fcd34d; }

/* ---------- 树视图 ---------- */
.bars.tree-mode {
  display: block;
  height: auto;
  padding-bottom: 0;
  border-bottom: 0;
}
.tree-svg { width: 100%; height: 340px; display: block; }
.tree-strip {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.tnode circle {
  fill: #16213a;
  stroke: #2b4a6f;
  stroke-width: 2;
  transition: fill .15s, stroke .15s;
}
.tnode text { fill: #e6edf7; font-size: 14px; font-weight: 600; }
.tnode.instack circle { stroke: var(--blue); stroke-dasharray: 4 3; }
.tnode.visited circle { fill: #1f5138; stroke: var(--green); }
.tnode.current circle { fill: #7c2d12; stroke: var(--amber); stroke-width: 3; }
.tedge { stroke: #2b4a6f; stroke-width: 2; }
.hidden { display: none !important; }
.metrics i { font-style: normal; }

/* ---------- 我的代码 ---------- */
.mycode {
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 10px 14px;
}
.mycode > summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--blue);
  user-select: none;
}
.mycode[open] > summary { margin-bottom: 10px; }
.mycode-hint {
  margin: 0 0 10px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
}
.mycode-hint code {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 11px;
}
#user-code {
  width: 100%;
  height: 220px;
  resize: vertical;
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 12.5px;
  line-height: 1.65;
  tab-size: 2;
}
.mycode-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
  flex-wrap: wrap;
}
#user-code-status { font-size: 12px; }
#user-code-status.ok { color: #86efac; }
#user-code-status.bad { color: #fcd34d; }

/* ---------- 运行记录 ---------- */
.history { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.history-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}
.history-head b { color: var(--text); }
.history-summary { color: var(--muted); }
.history-head button { padding: 4px 10px; font-size: 12px; }
.history-head button:first-of-type { margin-left: auto; }
#history-list {
  margin: 0;
  padding-left: 18px;
  max-height: 168px;
  overflow-y: auto;
  font-size: 12px;
  color: #b8c7db;
  line-height: 1.9;
}
#history-list li.err { color: #fcd34d; }
#history-list li span.time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }

/* ---------- 运行统计 ---------- */
.history-stats { margin: 6px 0 10px; display: flex; flex-direction: column; gap: 5px; }
.stat-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.stat-name { width: 96px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.stat-fill { display: block; height: 100%; background: linear-gradient(90deg, #2563eb, var(--blue)); }
.stat-val { width: 66px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <strong>算法学习智能体</strong>
      <span class="tag">原型 v0.1</span>
    </div>
    <div class="muted" id="progress-text">未开始</div>
  </header>

  <aside class="panel sidebar">
    <h2>知识图谱</h2>
    <div id="kg"></div>
  </aside>

  <main class="stage">
    <div class="toolbar">
      <label>算法
        <select id="algo-select"></select>
      </label>
      <label class="grow" id="input-wrap"><span id="input-label">输入（逗号分隔）</span>
        <input id="input-data" value="5, 2, 9, 1, 7, 3, 8" />
      </label>
      <button id="btn-regenerate" class="primary">生成</button>
    </div>

    <div id="bars" class="bars"></div>

    <div class="player">
      <button id="btn-prev">上一步</button>
      <button id="btn-play" class="primary">播放</button>
      <button id="btn-next">下一步</button>
      <input id="progress" type="range" min="0" max="0" value="0" />
      <span id="step-text" class="muted">0 / 0</span>
      <label class="speed">速度 <input id="speed" type="range" min="1" max="10" value="6" /></label>
    </div>

    <p id="note" class="note">选择一个算法，点击「生成」开始。</p>

    <div class="metrics">
      <span><i id="lbl-a">比较次数</i> <b id="m-compare">0</b></span>
      <span><i id="lbl-b">交换次数</i> <b id="m-swap">0</b></span>
      <span><i id="lbl-c">递归深度</i> <b id="m-depth">0</b></span>
      <span>当前步骤 <b id="m-index">0</b></span>
    </div>

    <details class="mycode" id="mycode">
      <summary>写我自己的算法 → 可视化运行（JavaScript）</summary>
      <p class="mycode-hint">
        写一个 <code>function run(a, viz)</code>，在关键位置调用 <code>viz.compare / viz.swap / viz.markSorted / viz.done</code>，
        <code>a</code> 就是上面输入框里的数组。点运行就能像内置算法一样播放。
      </p>
      <textarea id="user-code" spellcheck="false"></textarea>
      <div class="mycode-actions">
        <button id="btn-run-code" class="primary">运行我的代码</button>
        <button id="btn-template">插入示例</button>
        <button id="btn-clear-code">清空</button>
        <span id="user-code-status" class="muted"></span>
      </div>

      <div class="history">
        <div class="history-head">
          <span>运行记录 <b id="history-count">0</b> 条</span>
          <span class="history-summary" id="history-summary"></span>
          <button id="btn-export-runs">导出 JSON</button>
          <button id="btn-clear-runs">清空</button>
        </div>
        <div id="history-stats" class="history-stats"></div>
        <ol id="history-list"></ol>
      </div>
    </details>
  </main>

  <aside class="panel right">
    <section>
      <h2>理解度评估 <span class="badge">示例数据</span></h2>
      <div id="mastery"></div>
    </section>
    <section>
      <h2>下一步推荐</h2>
      <div id="recommend" class="recommend"></div>
    </section>
    <section>
      <h2>错误诊断 <span class="badge">规则模拟 · 未接大模型</span></h2>
      <textarea id="code-input" spellcheck="false" placeholder="把写错的代码粘进来，点下面的按钮"></textarea>
      <div class="diag-actions">
        <button id="btn-diagnose" class="primary">诊断这段代码</button>
        <button id="btn-health">测试连接</button>
      </div>
      <div id="health" class="health"></div>
      <div id="diagnosis" class="diagnosis"></div>
    </section>
  </aside>
</div>
<script>
/* ===== src/knowledge/graph.js ===== */
const __m_knowledge_graph = (function () {
/**
 * 知识图谱（v0：12 大类、45 个知识点）
 *
 * 目标版本是 12 大类、80 余个知识点（见申请书），
 * 这里先把结构和交互跑通，剩下的节点按同样格式往里加即可。
 *
 * 节点 id 规则：kp.<大类下标>.<节点下标>，算法通过 meta.kp 与节点绑定。
 */

const RAW = [
  ['基础数据结构', ['数组', '链表', '栈', '队列', '哈希表', '堆']],
  ['排序', ['冒泡排序', '插入排序', '快速排序', '归并排序', '堆排序']],
  ['查找', ['二分查找', '哈希查找']],
  ['递归与分治', ['递归', '分治', '回溯']],
  ['树', ['二叉树遍历', '二叉搜索树', '平衡树', '线段树']],
  ['图', ['图的存储', 'BFS', 'DFS', '拓扑排序', '最短路', '最小生成树']],
  ['动态规划', ['线性 DP', '区间 DP', '背包问题', '状态压缩 DP']],
  ['字符串', ['KMP', 'Trie 树', '字符串哈希']],
  ['贪心', ['区间贪心', '排序贪心']],
  ['数学', ['数论基础', '快速幂', '组合数学']],
  ['计算几何', ['凸包', '扫描线']],
  ['复杂度与技巧', ['时间复杂度分析', '双指针', '前缀和', '差分']]
];

/** 前置依赖：key 依赖 value 中的节点 */
const PREREQ = {
  'kp.1.2': ['kp.3.0'], // 快速排序 依赖 递归
  'kp.1.3': ['kp.3.1'], // 归并排序 依赖 分治
  'kp.2.0': ['kp.0.0'], // 二分查找 依赖 数组
  'kp.4.1': ['kp.4.0'], // 二叉搜索树 依赖 二叉树遍历
  'kp.5.3': ['kp.5.2'], // 拓扑排序 依赖 DFS
  'kp.5.4': ['kp.0.5'], // 最短路 依赖 堆
  'kp.6.2': ['kp.6.0'], // 背包 依赖 线性 DP
  'kp.7.0': ['kp.7.2'], // KMP 依赖 字符串哈希
  'kp.8.0': ['kp.1.0']  // 区间贪心 依赖 排序
};

const categories = RAW.map(([name, nodes], ci) => ({
  id: `cat.${ci}`,
  name,
  nodes: nodes.map((nodeName, ni) => {
    const id = `kp.${ci}.${ni}`;
    return {
      id,
      name: nodeName,
      category: name,
      prereq: PREREQ[id] || [],
      // 演示用掌握度：由 id 派生的稳定伪随机值（真实版本来自评估模型）
      mastery: demoMastery(id)
    };
  })
}));

const allNodes = categories.flatMap((cat) => cat.nodes);

const nodeById = new Map(allNodes.map((node) => [node.id, node]));

function demoMastery(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 1000;
  return 35 + (h % 55); // 35 ~ 89
}

/** 推荐下一知识点：掌握度最低、且前置已掌握 */
function recommend(nodes = allNodes) {
  const ready = nodes.filter(
    (node) => node.prereq.every((pre) => (nodeById.get(pre)?.mastery ?? 100) >= 60)
  );
  const pool = ready.length > 0 ? ready : nodes;
  const target = pool.reduce((a, b) => (a.mastery <= b.mastery ? a : b));

  const missing = target.prereq.filter((pre) => (nodeById.get(pre)?.mastery ?? 100) < 60);
  const why =
    missing.length > 0
      ? `前置知识点「${missing.map((id) => nodeById.get(id)?.name).join('、')}」还没掌握，建议先补。`
      : `掌握度 ${target.mastery}，是当前最薄弱的环节。`;

  return { node: target, why };
}
return { categories, allNodes, nodeById, recommend };
})();

/* ===== src/diagnosis/rules.js ===== */
const __m_diagnosis_rules = (function () {
/**
 * 错误诊断（规则版）
 *
 * 这是大模型诊断的“接口占位实现”：输入代码，输出固定结构的诊断结果。
 * 后面把 diagnose() 换成调用 Edge Function（服务端拼提示词、调模型）即可，
 * UI 一行都不用改 —— 这就是先定接口的好处。
 *
 * 输出结构与将来大模型返回的 JSON 保持一致：
 * { errorType, label, evidence, line, question, hint, confidence, forbidCompleteSolution }
 */

const RULES = [
  {
    id: 'out-of-range',
    label: '边界条件错误',
    evidence: '循环条件里用了 `<=` 搭配数组长度',
    question: '如果数组长度是 5，循环变量最大会取到几？最后一次访问的下标存在吗？',
    hint: '把 `<=` 改成 `<`，或者让上界减一。',
    locate: (code) => code.search(/for\s*\([^;]*;[^;]*<=\s*[\w.]+/)
  },
  {
    id: 'mid-overflow',
    label: '整数溢出 / 死循环风险',
    evidence: '中点写成 `(l + r) / 2`',
    question: '当 l 和 r 都很大时，l + r 会不会超出整型范围？换成什么写法可以避免？',
    hint: '用 `l + (r - l) / 2`。',
    locate: (code) => code.search(/\(\s*\w+\s*\+\s*\w+\s*\)\s*\/\s*2/)
  },
  {
    id: 'no-base-case',
    label: '递归缺少终止条件',
    evidence: '函数里调用了自身，但没有发现 if + return 的终止分支',
    question: '递归什么时候停下来？如果没有这个条件，函数会调用多少次？',
    hint: '先写终止条件，再写递归调用。',
    locate: (code) => {
      // 支持 C/Java 风格和 JS 风格两种函数定义
      const def = /(?:[A-Za-z_]\w*\s+)+([A-Za-z_]\w*)\s*\([^)]*\)\s*\{/.exec(code);
      if (!def) return -1;
      const selfCall = new RegExp('\\b' + def[1] + '\\s*\\(');
      const rest = code.replace(def[0], ''); // 去掉定义本身，避免自己匹配自己
      if (!selfCall.test(rest)) return -1;
      const hasBase = /if\s*\([^)]*\)\s*\{?\s*return/.test(code);
      return hasBase ? -1 : def.index;
    }
  },
  {
    id: 'empty-input',
    label: '空输入未处理',
    evidence: '直接访问了 `[0]`，但没有先判断数组是否为空',
    question: '如果输入是空数组，`arr[0]` 是什么？后面的代码还能正常跑吗？',
    hint: '在函数开头加一句空数组判断。',
    locate: (code) => {
      const touchesFirst = /\[\s*0\s*\]/.test(code);
      const guards = /length\s*===?\s*0|length\s*<\s*1|!\s*\w+\.length/.test(code);
      return touchesFirst && !guards ? 0 : -1;
    }
  },
  {
    id: 'wrong-compare',
    label: '比较方向可能写反',
    evidence: '比较之后直接 continue，可能跳过了本该处理的情况',
    question: '你要的是升序还是降序？这个比较符对应的方向对吗？',
    hint: '拿两个数在纸上摆一下，再核对一次比较符。',
    locate: (code) => code.search(/if\s*\([^)]*>\s*[^)]*\)\s*\{?\s*continue/)
  }
];

const FALLBACK = {
  id: 'logic',
  label: '逻辑结构待确认',
  evidence: '没有命中已知的错误模式',
  question: '先别改代码：用一句话说出这段代码每一步在干什么，再说它什么时候会出错。',
  hint: '用一组最小的输入（比如 3 个数）手动走一遍。'
};

function lineOf(code, index) {
  if (index < 0) return null;
  return code.slice(0, index).split('\n').length;
}

function diagnose(code) {
  const text = String(code || '').trim();

  if (text.length < 5) {
    return {
      errorType: 'unknown',
      label: '代码太短',
      evidence: '还没有可以分析的内容',
      question: '把完整的函数粘进来，包括循环和返回语句。',
      hint: '',
      line: null,
      confidence: 0,
      forbidCompleteSolution: true
    };
  }

  for (const rule of RULES) {
    const index = rule.locate(text);
    if (index >= 0) {
      return {
        errorType: rule.id,
        label: rule.label,
        evidence: rule.evidence,
        line: lineOf(text, index),
        question: rule.question,
        hint: rule.hint,
        confidence: 0.7,
        forbidCompleteSolution: true
      };
    }
  }

  return {
    errorType: FALLBACK.id,
    label: FALLBACK.label,
    evidence: FALLBACK.evidence,
    line: null,
    question: FALLBACK.question,
    hint: FALLBACK.hint,
    confidence: 0.35,
    forbidCompleteSolution: true
  };
}
return { diagnose };
})();

const __m_core_player = (function () {
/**
 * 播放器：只负责“第几步”，不负责算法也不负责画。
 *
 * 用到的三个概念，前端天天见：
 *  - 状态：index / playing
 *  - 状态变化后通知外部：onStep、onState
 *  - 定时器：setInterval
 */
class Player {
  constructor({ onStep, onState }) {
    this.steps = [];
    this.index = 0;
    this.playing = false;
    this.timer = null;
    this.speed = 6; // 1（慢）~ 10（快）
    this.onStep = onStep || (() => {});
    this.onState = onState || (() => {});
  }

  load(steps) {
    this.pause();
    this.steps = steps;
    this.index = 0;
    this.emitStep();
    this.emitState();
  }

  get total() {
    return this.steps.length;
  }

  get atEnd() {
    return this.index >= this.steps.length - 1;
  }

  current() {
    return this.steps[this.index];
  }

  next() {
    if (this.atEnd) return false;
    this.index++;
    this.emitStep();
    this.emitState();
    return true;
  }

  prev() {
    if (this.index <= 0) return false;
    this.index--;
    this.emitStep();
    this.emitState();
    return true;
  }

  seek(index) {
    const clamped = Math.max(0, Math.min(this.steps.length - 1, Number(index) || 0));
    this.index = clamped;
    this.emitStep();
    this.emitState();
  }

  play() {
    if (this.playing || this.steps.length === 0) return;
    if (this.atEnd) this.seek(0);

    this.playing = true;
    this.timer = setInterval(() => {
      if (!this.next()) this.pause();
    }, this.delay());
    this.emitState();
  }

  pause() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
    this.emitState();
  }

  toggle() {
    if (this.playing) this.pause();
    else this.play();
  }

  setSpeed(value) {
    this.speed = Math.max(1, Math.min(10, Number(value) || 6));
    if (this.playing) {
      this.pause();
      this.play();
    }
  }

  delay() {
    // 速度 10 → 60ms 一步；速度 1 → 780ms 一步
    return 840 - this.speed * 78;
  }

  emitStep() {
    if (this.steps.length === 0) return;
    this.onStep(this.steps[this.index], this.index);
  }

  emitState() {
    this.onState({
      index: this.index,
      total: this.steps.length,
      playing: this.playing,
      atEnd: this.atEnd
    });
  }
}
return { Player };
})();

const __m_render_arrayBars = (function () {
/**
 * 数组柱状图渲染器
 *
 * 渲染器只做一件事：把「一步」画出来。
 * 它不知道快速排序是什么，也不会自己去计算下一步 —— 这是它和执行器的分工。
 */
function createArrayBars(container) {
  let bars = [];

  function ensure(count) {
    if (bars.length === count) return;
    container.innerHTML = '';
    bars = [];
    for (let i = 0; i < count; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const label = document.createElement('span');
      bar.appendChild(label);
      container.appendChild(bar);
      bars.push(bar);
    }
  }

  function render(step) {
    const array = step.array;
    ensure(array.length);
    if (array.length === 0) return;

    const max = Math.max(...array, 1);
    const showLabel = array.length <= 30;

    for (let i = 0; i < array.length; i++) {
      const bar = bars[i];
      const value = array[i];

      bar.style.height = `${Math.max(4, (value / max) * 300)}px`;
      bar.firstChild.textContent = showLabel ? String(value) : '';

      let cls = 'bar';
      if (step.sorted[i]) cls += ' sorted';
      if (step.compare.includes(i)) cls += ' compare';
      if (step.swap.includes(i)) cls += ' swap';
      if (step.pivot === i) cls += ' pivot';
      bar.className = cls;
    }
  }

  return { render };
}
return { createArrayBars };
})();

/* ===== src/render/treeView.js ===== */
const __m_render_treeView = (function () {
/**
 * 二叉树渲染器（SVG）
 *
 * 和数组柱状图一样，它只认「一步」这个数据结构：
 *   { visited, current, stack, note, metrics }
 * 它不知道什么是前序中序，只是把“谁访问过、谁正在访问、栈里有什么”画出来。
 *
 * 布局规则：x 由中序序号决定（保证不重叠），y 由深度决定。
 * 这样同一棵树永远长一个样，切换遍历方式时不会晃来晃去。
 */
const SVG_NS = 'http://www.w3.org/2000/svg';
const RADIUS = 22;
const X_GAP = 92;
const Y_GAP = 86;
const PAD = 46;

function el(name, attrs = {}) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
  return node;
}

function createTreeView(container) {
  let svg = null;
  let nodeEls = new Map();
  let stackEl = null;
  let visitedEl = null;

  function buildTreeView(root) {
    container.innerHTML = '';
    nodeEls = new Map();
    if (!root) return;

    // 1. 算坐标：中序序号 → x，深度 → y
    const positions = new Map();
    let order = 0;
    let maxDepth = 0;

    const walk = (node, depth) => {
      if (!node) return;
      walk(node.left, depth + 1);
      positions.set(node.id, { x: PAD + order * X_GAP, y: PAD + depth * Y_GAP, node });
      order += 1;
      maxDepth = Math.max(maxDepth, depth);
      walk(node.right, depth + 1);
    };
    walk(root, 0);

    const width = PAD * 2 + Math.max(0, order - 1) * X_GAP;
    const height = PAD * 2 + maxDepth * Y_GAP;

    // 2. 画线（先画线，节点才能压在上面）
    svg = el('svg', {
      viewBox: `0 0 ${width} ${height}`,
      class: 'tree-svg',
      preserveAspectRatio: 'xMidYMid meet'
    });

    positions.forEach(({ x, y, node }) => {
      [node.left, node.right].forEach((child) => {
        if (!child) return;
        const p = positions.get(child.id);
        svg.appendChild(
          el('line', { x1: x, y1: y + RADIUS, x2: p.x, y2: p.y - RADIUS, class: 'tedge' })
        );
      });
    });

    // 3. 画节点
    positions.forEach(({ x, y, node }) => {
      const group = el('g', { class: 'tnode', 'data-id': node.id });
      group.appendChild(el('circle', { cx: x, cy: y, r: RADIUS }));
      const text = el('text', { x, y: y + 5, 'text-anchor': 'middle' });
      text.textContent = String(node.val);
      group.appendChild(text);
      svg.appendChild(group);
      nodeEls.set(node.id, group);
    });

    container.appendChild(svg);

    // 4. 栈与访问序列（文字辅助，解释“为什么是这个顺序”）
    const strip = document.createElement('div');
    strip.className = 'tree-strip';
    stackEl = document.createElement('span');
    stackEl.className = 'stack';
    visitedEl = document.createElement('span');
    visitedEl.className = 'visited';
    strip.appendChild(stackEl);
    strip.appendChild(visitedEl);
    container.appendChild(strip);
  }

  function label(root, ids) {
    return ids
      .map((id) => {
        const found = find(root, id);
        return found ? found.val : '?';
      })
      .join(' → ');
  }

  let treeRoot = null;

  function render(step) {
    if (!svg) return;

    nodeEls.forEach((group, id) => {
      group.classList.toggle('visited', step.visited.includes(id));
      group.classList.toggle('current', step.current === id);
      group.classList.toggle('instack', step.stack.includes(id));
    });

    if (stackEl) {
      stackEl.textContent = step.stack.length
        ? `栈（底 → 顶）：${label(treeRoot, step.stack)}`
        : '栈：空';
    }
    if (visitedEl) {
      visitedEl.textContent = step.visited.length
        ? `已访问：${label(treeRoot, step.visited)}`
        : '已访问：（还没开始）';
    }
  }

  function find(node, id) {
    if (!node) return null;
    if (node.id === id) return node;
    return find(node.left, id) || find(node.right, id);
  }

  return {
    view: 'tree',
    setTree(root) {
      treeRoot = root;
      buildTreeView(root);
    },
    render
  };
}
return { createTreeView };
})();

/* ===== src/algorithms/tree/model.js ===== */
const __m_algorithms_tree_model = (function () {
/**
 * 二叉树模型：把「层序数组」变成节点对象。
 *
 * 用层序数组是因为它最好写也最好读：
 *   [4, 2, 6, 1, 3, 5, 7]
 *        4
 *      /   \
 *     2     6
 *    / \   / \
 *   1   3 5   7
 * 下标 i 的左孩子在 2i+1，右孩子在 2i+2；null 表示空位。
 */
function buildTree(values) {
  if (!values || values.length === 0 || values[0] == null) return null;

  const nodes = values.map((value, index) =>
    value == null ? null : { id: `n${index}`, val: value, left: null, right: null }
  );

  for (let i = 0; i < nodes.length; i++) {
    if (!nodes[i]) continue;
    const leftIndex = i * 2 + 1;
    const rightIndex = i * 2 + 2;
    if (leftIndex < nodes.length) nodes[i].left = nodes[leftIndex];
    if (rightIndex < nodes.length) nodes[i].right = nodes[rightIndex];
  }

  return nodes[0];
}

/** 遍历所有节点，返回数组（渲染器要用它算坐标） */
function flatten(root) {
  const result = [];
  const walk = (node) => {
    if (!node) return;
    result.push(node);
    walk(node.left);
    walk(node.right);
  };
  walk(root);
  return result;
}
return { buildTree, flatten };
})();

/* ===== src/algorithms/tree/traversal.js ===== */
const __m_algorithms_tree_traversal = (function () {
/**
 * 二叉树遍历 —— 执行器
 *
 * 和排序算法一样：纯函数，产出「每一步的状态」，不碰 DOM。
 * 不同的是状态形状：这里记录「当前节点 / 已访问 / 栈里有什么」，
 * 因为树的可视化要画的是“访问顺序”和“栈的进出”，不是数组。

 * 一步的形状：
 * { visited: [节点id], current: 节点id|null, stack: [节点id], note, metrics }
 */
const { buildTree } = __m_algorithms_tree_model;

const DEMO_TREE = buildTree([4, 2, 6, 1, 3, 5, 7]);

function makeSteps() {
  const steps = [];
  const state = {
    visited: [],
    current: null,
    stack: [],
    metrics: { visited: 0, pushed: 0 }
  };

  const push = (note, extra = {}) => {
    steps.push({
      visited: state.visited.slice(),
      current: extra.current ?? state.current,
      stack: state.stack.slice(),
      note,
      metrics: { ...state.metrics }
    });
  };

  return { steps, state, push };
}

/** 前序：根 → 左 → 右（用栈，先压右再压左） */
const preorder = {
  meta: {
    id: 'tree.preorder',
    name: '二叉树前序遍历',
    kp: 'kp.4.0',
    brief: '根 → 左 → 右',
    view: 'tree',
    tree: DEMO_TREE
  },
  run(root = DEMO_TREE) {
    const { steps, state, push } = makeSteps();
    if (!root) {
      push('空树，没有可访问的节点');
      return steps;
    }

    state.stack.push(root.id);
    state.metrics.pushed++;
    push(`把根节点 ${root.val} 压栈`);

    while (state.stack.length > 0) {
      const id = state.stack.pop();
      const node = findById(root, id);
      state.visited.push(node.id);
      state.current = node.id;
      state.metrics.visited++;
      push(`弹出 ${node.val} 并访问它`);

      if (node.right) {
        state.stack.push(node.right.id);
        state.metrics.pushed++;
        push(`${node.val} 的右孩子 ${node.right.val} 后访问，先压栈`);
      }
      if (node.left) {
        state.stack.push(node.left.id);
        state.metrics.pushed++;
        push(`${node.val} 的左孩子 ${node.left.val} 先访问，后压栈（在栈顶）`);
      }
    }

    state.current = null;
    push('栈空，前序遍历结束');
    return steps;
  }
};

/** 中序：左 → 根 → 右（一路向左压栈，弹出来就访问） */
const inorder = {
  meta: {
    id: 'tree.inorder',
    name: '二叉树中序遍历',
    kp: 'kp.4.0',
    brief: '左 → 根 → 右',
    view: 'tree',
    tree: DEMO_TREE
  },
  run(root = DEMO_TREE) {
    const { steps, state, push } = makeSteps();
    if (!root) {
      push('空树，没有可访问的节点');
      return steps;
    }

    let current = root;
    push('从中序遍历的起点：根节点开始');

    while (current || state.stack.length > 0) {
      while (current) {
        state.stack.push(current.id);
        state.metrics.pushed++;
        push(`把 ${current.val} 压栈，继续往左走`);
        current = current.left;
      }

      const id = state.stack.pop();
      const node = findById(root, id);
      state.visited.push(node.id);
      state.current = node.id;
      state.metrics.visited++;
      push(`左边走到底了，弹出 ${node.val} 并访问`);

      current = node.right;
      if (current) {
        push(`转向 ${node.val} 的右子树 ${current.val}`);
      }
    }

    state.current = null;
    push('栈空且没有右子树可走，中序遍历结束');
    return steps;
  }

/** 后序：左 → 右 → 根（回到节点时还要判断右子树是否访问完） */
const postorder = {
  meta: {
    id: 'tree.postorder',
    name: '二叉树后序遍历',
    kp: 'kp.4.0',
    brief: '左 → 右 → 根',
    view: 'tree',
    tree: DEMO_TREE
  },
  run(root = DEMO_TREE) {
    const { steps, state, push } = makeSteps();
    if (!root) {
      push('空树，没有可访问的节点');
      return steps;
    }

    let lastVisited = null;
    state.stack.push(root.id);
    state.metrics.pushed++;
    push('把根节点压栈');

    while (state.stack.length > 0) {
      const topId = state.stack[state.stack.length - 1];
      const node = findById(root, topId);

      if (node.left && lastVisited !== node.left.id && lastVisited !== node.right?.id) {
        state.stack.push(node.left.id);
        state.metrics.pushed++;
        push(`${node.val} 的左子树还没走，先去 ${node.left.val}`);
        continue;
      }

      if (node.right && lastVisited !== node.right.id) {
        state.stack.push(node.right.id);
        state.metrics.pushed++;
        push(`${node.val} 的左子树走完了，转到右子树 ${node.right.val}`);
        continue;
      }

      state.stack.pop();
      state.visited.push(node.id);
      state.current = node.id;
      state.metrics.visited++;
      lastVisited = node.id;
      push(`${node.val} 的左右都访问完了，最后访问它`);
    }

    state.current = null;
    push('栈空，后序遍历结束');
    return steps;
  }
};

function findById(root, id) {
  if (!root) return null;
  if (root.id === id) return root;
  return findById(root.left, id) || findById(root.right, id);
}
return { preorder, inorder, postorder };
})();

/* ===== src/llm/client.js ===== */
const __m_llm_client = (function () {
/**
 * 大模型诊断客户端
 *
 * 只做三件事：发请求、超时、把结果归一化。
 * 任何失败都不抛异常，而是返回 { ok:false, reason, status, detail }，让调用方静默降级到本地规则。
 */
const ENDPOINT = '/api/diagnose';
const HEALTH_ENDPOINT = '/api/health';
const DEFAULT_TIMEOUT = 25000;

async function diagnoseWithLLM(input, options = {}) {
  // 离线版（file:// 打开）没有服务端，直接走本地规则，省掉一次必然失败的请求
  if (typeof location !== 'undefined' && location.protocol === 'file:') {
    return { ok: false, reason: 'offline_file' };
  }

  const timeoutMs = options.timeoutMs ?? DEFAULT_TIMEOUT;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const response = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: input.code,
        problem: input.problem || '',
        algorithm: input.algorithm || '',
        language: input.language || 'C++'
      }),
      signal: controller.signal
    });

    let data = null;
    try {
      data = await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {
      return {
        ok: false,
        reason: `http_${response.status}`,
        status: response.status,
        detail: (data && (data.message || data.reason)) || ''
      };
    }

    if (!data || !data.ok) {
      return {
        ok: false,
        reason: (data && data.reason) || 'unknown',
        status: response.status,
        detail: (data && data.message) || ''
      };
    }

    if (!data.result || typeof data.result.question !== 'string') {
      return { ok: false, reason: 'bad_result', status: response.status };
    }

    return { ok: true, result: data.result, meta: data.meta || {} };
  } catch (error) {
    if (error.name === 'AbortError') return { ok: false, reason: 'timeout' };
    return { ok: false, reason: 'network' };
  } finally {
    clearTimeout(timer);
  }
}

/** 连接自检：读服务端的配置状态；probe=true 时会真的调一次模型（消耗几十个 token） */
async function checkHealth(probe = false) {
  if (typeof location !== 'undefined' && location.protocol === 'file:') {
    return { ok: false, reason: 'offline_file' };
  }
  try {
    const response = await fetch(HEALTH_ENDPOINT + (probe ? '?probe=1' : ''), {
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return { ok: false, reason: `http_${response.status}` };
    return { ok: true, data: await response.json() };
  } catch {
    return { ok: false, reason: 'network' };
  }
}

/** 把失败原因翻译成给用户看的一句话；带 status/detail 时一并显示，方便排查 */
function explainFailure(failure) {
  const info = typeof failure === 'string' ? { reason: failure } : failure || {};
  const reason = info.reason || 'unknown';
  const detail = String(info.detail || '');

  // 上游的具体错误优先翻译，比通用文案有用得多
  if (/insufficient balance|余额不足|quota exceeded/i.test(detail)) {
    return `账户余额不足，需要充值（${detail.slice(0, 40)}）`;
  }
  if (/authentication fails|invalid.*api key|incorrect api key/i.test(detail)) {
    return 'key 无效或已过期，请重新复制一份';
  }
  if (/rate limit|too many requests/i.test(detail)) {
    return '请求太频繁，被平台限流了，等一分钟再试';
  }

  const map = {
    offline_file: '当前是离线版，不连模型',
    no_api_key: '服务端没有配置 key（检查 .env 是否放对位置）',
    network: '连不上诊断服务（服务没启动，或端口被别的程序占用）',
    timeout: '模型响应超时',
    rate_limited: '调用太频繁',
    upstream_error: '模型接口报错（key 可能无效、欠费或被限流）',
    bad_output: '模型返回的内容解析不了',
    bad_result: '模型返回的字段不完整',
    unknown: '未知原因'
  };

  let text = map[reason];
  if (!text) {
    if (reason.startsWith('http_')) {
      text = `诊断服务返回 ${reason.slice(5)}（旧版服务没有接口，重启一次即可）`;
    } else {
      text = `未知原因：${reason}`;
    }
  }

  if (info.detail) text += `（${String(info.detail).slice(0, 60)}）`;
  return text;
}
return { diagnoseWithLLM, checkHealth, explainFailure };
})();

/* ===== src/user/runner.js ===== */
const __m_user_runner = (function () {
/**
 * 「我自己的代码」执行器
 *
 * 核心设计：任何语言都无法“自动”知道算法执行到哪一步，
 * 必须由代码主动报告状态 —— 所以给使用者一个 viz 对象，在关键位置调用它。
 *
 * 使用者写：
 *   function run(a, viz) {
 *     viz.compare(i, j, '比较两个元素');
 *     viz.swap(i, j, '交换');
 *   }
 *
 * 我们把它跑起来，收集每一步的数组快照，交给现有的柱状图渲染器播放。
 * 这样“加一个自己的算法”不需要改任何界面代码。
 */
const MAX_STEPS = 3000;

const TEMPLATE = [
  '// 在这里写你的算法：a 是数组（可以直接改），viz 用来记录每一步',
  'function run(a, viz) {',
  '  for (let i = 0; i < a.length - 1; i++) {',
  '    for (let j = 0; j < a.length - 1 - i; j++) {',
  '      viz.compare(j, j + 1, `比较 a[${j}]=${a[j]} 与 a[${j + 1}]=${a[j + 1]}`);',
  '      if (a[j] > a[j + 1]) {',
  '        viz.swap(j, j + 1, `逆序，交换 a[${j}] 和 a[${j + 1}]`);',
  '      }',
  '    }',
  '    viz.markSorted(a.length - 1 - i, `第 ${i + 1} 轮结束，a[${a.length - 1 - i}] 就位`);',
  '  }',
  "  viz.done('排序完成');",
  '}'
].join('\n');

const API_HINT = [
  'viz.compare(i, j, 说明)  比较两个位置',
  'viz.swap(i, j, 说明)     交换两个位置',
  'viz.set(i, 值, 说明)     给某个位置赋值',
  'viz.markSorted(i, 说明)  标记某位置已就位',
  'viz.show(说明, {compare:[i], swap:[j], pivot:i})  自定义一步',
  'viz.done(说明)           结束'
].join('\n');

function runUserCode(source, input) {
  const a = Array.isArray(input) ? input.slice() : [];
  const steps = [];
  const sorted = new Array(a.length).fill(false);
  const metrics = { comparisons: 0, swaps: 0 };

  const snapshot = (note, opts = {}) => {
    if (steps.length >= MAX_STEPS) {
      throw new Error(`步骤超过 ${MAX_STEPS} 步，可能是死循环。检查一下循环的终止条件。`);
    }
    steps.push({
      array: a.slice(),
      sorted: sorted.slice(),
      pivot: opts.pivot ?? -1,
      compare: opts.compare ?? [],
      swap: opts.swap ?? [],
      depth: opts.depth ?? 0,
      note: String(note ?? ''),
      metrics: { ...metrics }
    });
  };

  const viz = {
    show(note, opts) {
      snapshot(note, opts);
    },
    compare(i, j, note) {
      metrics.comparisons += 1;
      snapshot(note ?? `比较 a[${i}] 和 a[${j}]`, { compare: [i, j] });
    },
    swap(i, j, note) {
      [a[i], a[j]] = [a[j], a[i]];
      metrics.swaps += 1;
      snapshot(note ?? `交换 a[${i}] 和 a[${j}]`, { swap: [i, j] });
    },
    set(i, value, note) {
      a[i] = value;
      snapshot(note ?? `a[${i}] = ${value}`);
    },
    markSorted(i, note) {
      sorted[i] = true;
      snapshot(note ?? `a[${i}] 已就位`);
    },
    done(note) {
      sorted.fill(true);
      snapshot(note ?? '完成');
    }
  };

  let run;
  try {
    // 用户代码只在这个函数作用域里跑，拿不到页面的其他变量
    const factory = new Function('viz', `"use strict";\n${source}\n;return typeof run === "function" ? run : null;`);
    run = factory(viz);
  } catch (error) {
    return { ok: false, error: `代码有语法错误：${error.message}`, hint: API_HINT };
  }

  if (typeof run !== 'function') {
    return {
      ok: false,
      error: '没有找到 run 函数。算法要写进 function run(a, viz) { ... } 里面。',
      hint: API_HINT
    };
  }

  try {
    run(a, viz);
  } catch (error) {
    return {
      ok: false,
      error: `运行出错：${error.message}`,
      steps,
      hint: steps.length ? '下面是你已经跑出来的部分，可以先播放看看。' : API_HINT
    };
  }

  if (steps.length === 0) {
    return {
      ok: false,
      error: '一步都没记录。请在关键位置调用 viz.compare / viz.swap / viz.show。',
      hint: API_HINT
    };
  }

  return { ok: true, steps };
}
return { MAX_STEPS, TEMPLATE, runUserCode };
})();

/* ===== src/user/history.js ===== */
const __m_user_history = (function () {
/**
 * 运行记录
 *
 * 这是本项目第一份「真实行为数据」：每次运行（内置算法或用户自己的代码）都记一条，
 * 包含规模、步数、比较/交换次数、耗时、是否出错。
 *
 * 现在的用途是本地统计；以后接 Supabase 时，把 saveRecords 换成写库即可，
 * 上层代码不用动。理解度评估的六维特征将来就从这类记录里算。
 */
const STORAGE_KEY = 'algo-agent:runs';
const MAX_RECORDS = 50;

/** 纯函数，方便测试：往列表头部插入一条并截断 */
function pushRecord(records, record, max = MAX_RECORDS) {
  return [record, ...records].slice(0, max);
}

/** 简单统计，给面板显示用 */
function summarize(records) {
  if (!records || records.length === 0) {
    return { count: 0, errors: 0, avgComparisons: 0, avgSteps: 0 };
  }
  const ok = records.filter((r) => !r.error);
  const avg = (list, key) =>
    list.length === 0
      ? 0
      : Math.round(list.reduce((sum, item) => sum + (Number(item[key]) || 0), 0) / list.length);

  return {
    count: records.length,
    errors: records.length - ok.length,
    avgComparisons: avg(ok, 'comparisons'),
    avgSteps: avg(ok, 'steps')
  };
}

function loadRecords(storage) {
  try {
    const raw = storage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function saveRecords(storage, records) {
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch {
    /* 隐私模式写不进去，忽略 */
  }
}

function clearAll(storage) {
  try {
    storage.removeItem(STORAGE_KEY);
  } catch {
    /* 忽略 */
  }
}

/** 导出成可读的 JSON（以后论文里的“行为日志样例”可以直接引用） */
function serialize(records) {
  return JSON.stringify(
    {
      exportedAt: new Date().toISOString(),
      schema: 'algo-agent.runs.v1',
      records
    },
    null,
    2
  );
}

/** 按算法分组统计，给「运行记录」的统计条用 */
function groupBy(records) {
  const map = new Map();

  for (const record of records || []) {
    const key = record.algorithm || '未知';
    if (!map.has(key)) {
      map.set(key, { algorithm: key, count: 0, errors: 0, steps: 0, ms: 0, comparisons: 0, withComparisons: 0 });
    }
    const group = map.get(key);
    group.count += 1;

    if (record.error) {
      group.errors += 1;
      continue;
    }
    group.steps += Number(record.steps) || 0;
    group.ms += Number(record.ms) || 0;
    if (Number.isFinite(record.comparisons)) {
      group.comparisons += record.comparisons;
      group.withComparisons += 1;
    }
  }

  return [...map.values()]
    .map((group) => {
      const ok = group.count - group.errors;
      return {
        algorithm: group.algorithm,
        count: group.count,
        errors: group.errors,
        avgSteps: ok ? Math.round(group.steps / ok) : 0,
        avgMs: ok ? Math.round(group.ms / ok) : 0,
        avgComparisons: group.withComparisons ? Math.round(group.comparisons / group.withComparisons) : null
      };
    })
    .sort((a, b) => b.count - a.count);
}

/** 一行摘要，面板用 */
function describe(record) {
  if (record.error) return `${record.algorithm} · 出错：${record.error}`;

  const parts = [record.algorithm];
  if (record.size) parts.push(`n=${record.size}`);
  parts.push(`${record.steps} 步`);
  if (Number.isFinite(record.comparisons)) parts.push(`比较 ${record.comparisons}`);
  if (Number.isFinite(record.swaps)) parts.push(`交换 ${record.swaps}`);
  parts.push(`${record.ms} ms`);
  return parts.join(' · ');
}
return { STORAGE_KEY, MAX_RECORDS, pushRecord, summarize, loadRecords, saveRecords, clearAll, serialize, groupBy, describe };
})();

const __m_algorithms_sort_quick = (function () {
/**
 * 快速排序 —— 执行器
 *
 * 约定（整个项目所有算法都必须遵守）：
 *   run(input) 是纯函数：不改动 input，不碰 DOM，不读时间/随机数。
 *   返回值是「每一步的快照数组」，渲染器只认这个数组。
 *
 * 一步的形状见 src/core/types.js
 */
const meta = {
  id: 'sort.quick',
  name: '快速排序',
  kp: 'kp.1.2', // 对应知识图谱里的「快速排序」
  brief: '选基准 → 划分 → 递归左右两段'
};

function run(input) {
  const a = input.slice();
  const steps = [];
  const sorted = new Array(a.length).fill(false);
  const metrics = { comparisons: 0, swaps: 0 };

  const push = (note, extra = {}) => {
    steps.push({
      array: a.slice(),
      sorted: sorted.slice(),
      pivot: extra.pivot ?? -1,
      compare: extra.compare ?? [],
      swap: extra.swap ?? [],
      depth: extra.depth ?? 0,
      note,
      metrics: { ...metrics }
    });
  };

  if (a.length === 0) {
    push('输入为空，没有可排序的元素');
    return steps;
  }

  push('初始数组，准备以每段最后一个元素为基准做划分');

  const sortRange = (lo, hi, depth) => {
    if (lo > hi) return;
    if (lo === hi) {
      sorted[lo] = true;
      push(`区间 [${lo}, ${lo}] 只剩一个元素，位置已确定`, { depth });
      return;
    }

    const pivotValue = a[hi];
    push(`区间 [${lo}, ${hi}]，取 a[${hi}] = ${pivotValue} 作为基准`, { pivot: hi, depth });

    let store = lo;
    for (let i = lo; i < hi; i++) {
      metrics.comparisons++;
      push(`比较 a[${i}] = ${a[i]} 与基准 ${pivotValue}`, { pivot: hi, compare: [i], depth });
      if (a[i] < pivotValue) {
        if (i !== store) {
          [a[i], a[store]] = [a[store], a[i]];
          metrics.swaps++;
          push(`a[${i}] 更小，与 a[${store}] 交换，指针后移`, { swap: [i, store], depth });
        }
        store++;
      }
    }

    if (store !== hi) {
      [a[store], a[hi]] = [a[hi], a[store]];
      metrics.swaps++;
    }
    sorted[store] = true;
    push(`基准 ${pivotValue} 归位到下标 ${store}：左边都比它小，右边都比它大`, { pivot: store, depth });

    sortRange(lo, store - 1, depth + 1);
    sortRange(store + 1, hi, depth + 1);
  };

  sortRange(0, a.length - 1, 0);

  sorted.fill(true);
  push('排序完成', { depth: 0 });
  return steps;
}
return { meta, run };
})();

/* ===== src/algorithms/sort/bubble.js ===== */
const __m_algorithms_sort_bubble = (function () {
/** 冒泡排序 —— 执行器（结构同 quick.js，可直接对照阅读） */
const meta = {
  id: 'sort.bubble',
  name: '冒泡排序',
  kp: 'kp.1.0',
  brief: '相邻两两比较，大的往后冒'
};

function run(input) {
  const a = input.slice();
  const steps = [];
  const sorted = new Array(a.length).fill(false);
  const metrics = { comparisons: 0, swaps: 0 };

  const push = (note, extra = {}) => {
    steps.push({
      array: a.slice(),
      sorted: sorted.slice(),
      pivot: -1,
      compare: extra.compare ?? [],
      swap: extra.swap ?? [],
      depth: 0,
      note,
      metrics: { ...metrics }
    });
  };

  push('初始数组');

  for (let end = a.length - 1; end > 0; end--) {
    let swapped = false;
    for (let i = 0; i < end; i++) {
      metrics.comparisons++;
      push(`比较 a[${i}] = ${a[i]} 与 a[${i + 1}] = ${a[i + 1]}`, { compare: [i, i + 1] });
      if (a[i] > a[i + 1]) {
        [a[i], a[i + 1]] = [a[i + 1], a[i]];
        metrics.swaps++;
        swapped = true;
        push('左边比右边大，交换', { swap: [i, i + 1] });
      }
    }
    sorted[end] = true;
    push(`第 ${a.length - end} 轮结束，a[${end}] = ${a[end]} 已归位`);

    if (!swapped) {
      for (let k = 0; k < a.length; k++) sorted[k] = true;
      push('这一轮没有发生交换，说明已经有序，提前结束');
      break;
    }
  }

  sorted.fill(true);
  push('排序完成');
  return steps;
}
return { meta, run };
})();

const __m_algorithms_sort_insertion = (function () {
/** 插入排序 —— 执行器 */
const meta = {
  id: 'sort.insertion',
  name: '插入排序',
  kp: 'kp.1.1',
  brief: '把当前元素插到前面已排好的序列里'
};

function run(input) {
  const a = input.slice();
  const steps = [];
  const sorted = new Array(a.length).fill(false);
  const metrics = { comparisons: 0, swaps: 0 };

  const push = (note, extra = {}) => {
    steps.push({
      array: a.slice(),
      sorted: sorted.slice(),
      pivot: extra.pivot ?? -1,
      compare: extra.compare ?? [],
      swap: extra.swap ?? [],
      depth: 0,
      note,
      metrics: { ...metrics }
    });
  };

  if (a.length > 0) sorted[0] = true;
  push('第一个元素自己就算有序');

  for (let i = 1; i < a.length; i++) {
    const key = a[i];
    push(`取出 a[${i}] = ${key}，准备插到前面合适的位置`, { pivot: i });

    let j = i - 1;
    while (j >= 0) {
      metrics.comparisons++;
      push(`比较 a[${j}] = ${a[j]} 与 ${key}`, { pivot: i, compare: [j] });
      if (a[j] <= key) break;
      a[j + 1] = a[j];
      metrics.swaps++;
      push(`${a[j]} 比 ${key} 大，右移一格`, { pivot: i, swap: [j, j + 1] });
      j--;
    }

    a[j + 1] = key;
    for (let k = 0; k <= i; k++) sorted[k] = true;
    push(`把 ${key} 放到下标 ${j + 1}，前 ${i + 1} 个元素已有序`, { pivot: j + 1 });
  }

  sorted.fill(true);
  push('排序完成');
  return steps;
}
return { meta, run };
})();

/* ===== src/algorithms/registry.js ===== */
const __m_algorithms_registry = (function () {
/**
 * 算法注册表
 *
 * 新增一个算法 = 建一个文件（导出 meta 和 run）+ 在这里登记一行。
 * 界面、播放器、渲染器都不需要改，这是这套架构的意义。
 *
 * meta.view 决定用哪个渲染器：'array' 用柱状图，'tree' 用 SVG 树。
 */
const quick = __m_algorithms_sort_quick;
const bubble = __m_algorithms_sort_bubble;
const insertion = __m_algorithms_sort_insertion;
const { preorder, inorder, postorder } = __m_algorithms_tree_traversal;

const sorts = [quick, bubble, insertion].map((mod) => ({
  ...mod.meta,
  view: 'array',
  run: mod.run
}));

const traversals = [preorder, inorder, postorder].map((mod) => ({
  ...mod.meta,
  run: mod.run
}));

const algorithms = [...sorts, ...traversals];

function findAlgorithm(id) {
  return algorithms.find((algo) => algo.id === id) || algorithms[0];
}

function findByKnowledgePoint(kpId) {
  return algorithms.find((algo) => algo.kp === kpId) || null;
}
return { algorithms, findAlgorithm, findByKnowledgePoint };
})();

/* ===== src/app.js ===== */
const __m_app = (function () {
/**
 * 应用入口：把「知识图谱 → 算法执行器 → 渲染器 → 播放器 → 诊断/评估」串起来。
 *
 * 这个文件只做装配，不写算法、不画图、不拼提示词。
 * 想加功能时，先想清楚该改哪个模块，再动手。
 */
const { algorithms, findByKnowledgePoint } = __m_algorithms_registry;
const { createArrayBars } = __m_render_arrayBars;
const { createTreeView } = __m_render_treeView;
const { buildTree } = __m_algorithms_tree_model;
const { Player } = __m_core_player;
const { categories, nodeById, recommend } = __m_knowledge_graph;
const { diagnose } = __m_diagnosis_rules;
const { diagnoseWithLLM, checkHealth, explainFailure } = __m_llm_client;
const { createDiagnosisView } = __m_ui_diagnosisPanel;
const { createMastery } = __m_ui_mastery;
const { runUserCode, TEMPLATE } = __m_user_runner;
const { pushRecord, loadRecords, saveRecords, clearAll, summarize, serialize, describe, groupBy } = __m_user_history;

const $ = (id) => document.getElementById(id);

const el = {
  select: $('algo-select'),
  input: $('input-data'),
  regenerate: $('btn-regenerate'),
  bars: $('bars'),
  prev: $('btn-prev'),
  play: $('btn-play'),
  next: $('btn-next'),
  progress: $('progress'),
  stepText: $('step-text'),
  speed: $('speed'),
  note: $('note'),
  compare: $('m-compare'),
  swap: $('m-swap'),
  depth: $('m-depth'),
  index: $('m-index'),
  kg: $('kg'),
  mastery: $('mastery'),
  recommend: $('recommend'),
  code: $('code-input'),
  diagnoseBtn: $('btn-diagnose'),
  diagnosis: $('diagnosis'),
  healthBtn: $('btn-health'),
  health: $('health'),
  progressText: $('progress-text'),
  lblA: $('lbl-a'),
  lblB: $('lbl-b'),
  lblC: $('lbl-c'),
  inputWrap: $('input-wrap'),
  inputLabel: $('input-label'),
  mycode: $('mycode'),
  userCode: $('user-code'),
  runCode: $('btn-run-code'),
  templateBtn: $('btn-template'),
  clearCode: $('btn-clear-code'),
  codeStatus: $('user-code-status'),
  historyCount: $('history-count'),
  historySummary: $('history-summary'),
  historyList: $('history-list'),
  historyStats: $('history-stats'),
  exportRuns: $('btn-export-runs'),
  clearRuns: $('btn-clear-runs')
};

/** 下拉框里的“我的代码”入口 */
const USER_ALGO = {
  id: 'user.code',
  name: '我的代码（自己写）',
  brief: '在下方输入框里写 run(a, viz)',
  view: 'array'
};
const menu = [...algorithms, USER_ALGO];

const ARRAY_DEFAULT = '5, 2, 9, 1, 7, 3, 8';
const TREE_DEFAULT = '4, 2, 6, 1, 3, 5, 7';

let renderer = null;
let skipFirstRecord = true; // 页面刚打开时的首次生成不计入记录
const mastery = createMastery(el.mastery);

let currentAlgo = algorithms[0];

/** 按算法的 view 切换渲染器：数组柱状图 / SVG 树 */
function ensureRenderer(view) {
  if (renderer && renderer.view === view) return renderer;
  el.bars.innerHTML = '';
  el.bars.classList.toggle('tree-mode', view === 'tree');
  renderer = view === 'tree' ? createTreeView(el.bars) : createArrayBars(el.bars);
  return renderer;
}

const player = new Player({
  onStep: (step, index) => {
    renderer.render(step);
    el.note.textContent = step.note;

    const metrics = step.metrics || {};
    el.compare.textContent = metrics.comparisons ?? metrics.visited ?? 0;
    el.swap.textContent = metrics.swaps ?? metrics.pushed ?? 0;
    el.depth.textContent = step.depth ?? (step.stack ? step.stack.length : 0);

    el.index.textContent = index;
    el.progress.value = String(index);
    el.stepText.textContent = `${index + 1} / ${player.total}`;
  },
  onState: (st) => {
    el.play.textContent = st.playing ? '暂停' : '播放';
    el.prev.disabled = st.index <= 0;
    el.next.disabled = st.total === 0 || st.index >= st.total - 1;
    el.progress.max = String(Math.max(0, st.total - 1));
    el.progressText.textContent = st.total === 0 ? '未开始' : `${st.index + 1} / ${st.total} 步`;
  }
});

/* ---------------- 输入与生成 ---------------- */

function parseInput(text) {
  const nums = String(text)
    .split(/[,\s，、]+/)
    .filter(Boolean)
    .map(Number)
    .filter((n) => Number.isFinite(n));

  if (nums.length === 0) return [5, 2, 9, 1, 7, 3, 8];
  return nums.slice(0, 60).map((n) => Math.round(n));
}

/** 层序数组 → 二叉树；null / 空 / none 表示空位 */
function parseTreeInput(text) {
  const parts = String(text)
    .split(/[,\s，、]+/)
    .filter(Boolean);

  const values = parts.slice(0, 31).map((part) => {
    if (/^(null|none|空|-)$/i.test(part)) return null;
    const num = Number(part);
    return Number.isFinite(num) ? Math.round(num) : null;
  });

  if (values.length === 0) return buildTree([4, 2, 6, 1, 3, 5, 7]);
  return buildTree(values);
}

function build() {
  if (currentAlgo.id === USER_ALGO.id) {
    el.mycode.open = true;
    runMyCode();
    return;
  }

  const view = currentAlgo.view || 'array';
  ensureRenderer(view);

  // 切换指标名称：数组看比较/交换，树看访问/入栈
  const isTree = view === 'tree';
  el.lblA.textContent = isTree ? '已访问' : '比较次数';
  el.lblB.textContent = isTree ? '入栈次数' : '交换次数';
  el.lblC.textContent = isTree ? '栈内元素' : '递归深度';
  el.inputLabel.textContent = isTree ? '层序数组（null 表示空位）' : '输入（逗号分隔）';

  const tree = isTree ? parseTreeInput(el.input.value) : null;
  if (isTree) renderer.setTree(tree);

  const input = parseInput(el.input.value);
  const started = performance.now();
  const steps = isTree ? currentAlgo.run(tree) : currentAlgo.run(input);
  const elapsed = Math.round(performance.now() - started);

  player.load(steps);
  el.speed.value = String(player.speed);

  const last = steps[steps.length - 1];
  const metrics = (last && last.metrics) || {};
  if (skipFirstRecord) {
    skipFirstRecord = false;
    return;
  }
  addRun({
    at: new Date().toISOString(),
    algorithm: currentAlgo.name,
    kind: isTree ? 'tree' : 'builtin',
    size: isTree ? (last && last.visited ? last.visited.length : 0) : input.length,
    steps: steps.length,
    comparisons: isTree ? null : metrics.comparisons ?? null,
    swaps: isTree ? null : metrics.swaps ?? null,
    ms: elapsed,
    error: null
  });
}

/* ---------------- 算法下拉框 ---------------- */

algorithms.forEach((algo) => {
  const option = document.createElement('option');
  option.value = algo.id;
  option.textContent = `${algo.name}（${algo.brief}）`;
  el.select.appendChild(option);
});

const userOption = document.createElement('option');
userOption.value = USER_ALGO.id;
userOption.textContent = `${USER_ALGO.name}（${USER_ALGO.brief}）`;
el.select.appendChild(userOption);

el.select.value = currentAlgo.id;

el.select.addEventListener('change', () => {
  currentAlgo = menu.find((algo) => algo.id === el.select.value) || algorithms[0];

  // 切换视图时，如果输入还是另一边的默认值，就给个像样的示例
  const current = el.input.value.trim();
  if (currentAlgo.view === 'tree' && current === ARRAY_DEFAULT) el.input.value = TREE_DEFAULT;
  if (currentAlgo.view !== 'tree' && current === TREE_DEFAULT) el.input.value = ARRAY_DEFAULT;

  build();
  markActiveKnowledgePoint();
});

/* ---------------- 我的代码 ---------------- */

const CODE_KEY = 'algo-agent:usercode';

function setCodeStatus(text, kind) {
  el.codeStatus.textContent = text;
  el.codeStatus.className = kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : 'muted';
}

function persistCode() {
  try {
    localStorage.setItem(CODE_KEY, el.userCode.value);
  } catch {
    /* 隐私模式下写不了，忽略 */
  }
}

function runMyCode() {
  ensureRenderer('array');
  el.lblA.textContent = '比较次数';
  el.lblB.textContent = '交换次数';
  el.lblC.textContent = '递归深度';
  el.inputWrap.classList.remove('hidden');

  const input = parseInput(el.input.value);
  const started = performance.now();
  const result = runUserCode(el.userCode.value, input);
  const elapsed = Math.round(performance.now() - started);

  persistCode();

  if (!result.ok) {
    setCodeStatus(result.error, 'bad');
    addRun({
      at: new Date().toISOString(),
      algorithm: '我的代码',
      kind: 'user',
      size: input.length,
      steps: result.steps ? result.steps.length : 0,
      comparisons: null,
      swaps: null,
      ms: elapsed,
      error: result.error
    });
    if (result.steps && result.steps.length > 0) {
      player.load(result.steps);
      el.note.textContent = result.error;
    }
    return;
  }

  const last = result.steps[result.steps.length - 1];
  player.load(result.steps);
  setCodeStatus(`运行成功，共 ${result.steps.length} 步`, 'ok');
  addRun({
    at: new Date().toISOString(),
    algorithm: '我的代码',
    kind: 'user',
    size: input.length,
    steps: result.steps.length,
    comparisons: last.metrics.comparisons,
    swaps: last.metrics.swaps,
    ms: elapsed,
    error: null
  });
}

try {
  el.userCode.value = localStorage.getItem(CODE_KEY) || TEMPLATE;
} catch {
  el.userCode.value = TEMPLATE;
}

el.runCode.addEventListener('click', () => {
  currentAlgo = USER_ALGO;
  el.select.value = USER_ALGO.id;
  runMyCode();
});

el.templateBtn.addEventListener('click', () => {
  el.userCode.value = TEMPLATE;
  setCodeStatus('已插入示例，点「运行我的代码」', 'muted');
});

el.clearCode.addEventListener('click', () => {
  el.userCode.value = '';
  setCodeStatus('', 'muted');
});

/* ---------------- 运行记录 ---------------- */

let runs = [];
try {
  runs = loadRecords(localStorage);
} catch {
  runs = [];
}

function escapeText(str) {
  return String(str).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderRuns() {
  const stats = summarize(runs);
  el.historyCount.textContent = String(stats.count);
  el.historySummary.textContent = stats.count
    ? `平均 ${stats.avgSteps} 步 · 平均比较 ${stats.avgComparisons} 次` + (stats.errors ? ` · 出错 ${stats.errors} 次` : '')
    : '还没有记录';

  el.historyList.innerHTML = runs
    .slice(0, 8)
    .map((record) => {
      const time = String(record.at || '').slice(11, 19);
      const cls = record.error ? ' class="err"' : '';
      return `<li${cls}><span class="time">${time}</span>${escapeText(describe(record))}</li>`;
    })
    .join('');

  renderStats();
}

function renderStats() {
  const groups = groupBy(runs).slice(0, 4);
  if (groups.length === 0) {
    el.historyStats.innerHTML = '';
    return;
  }

  const max = Math.max(...groups.map((g) => g.count));
  el.historyStats.innerHTML = groups
    .map((group) => {
      const width = Math.round((group.count / max) * 100);
      const compare = group.avgComparisons === null ? '' : ` · 比较 ${group.avgComparisons}`;
      return `
        <div class="stat-row" title="平均 ${group.avgSteps} 步${compare} · 平均 ${group.avgMs} ms">
          <span class="stat-name">${escapeText(group.algorithm)}</span>
          <span class="stat-track"><span class="stat-fill" style="width:${width}%"></span></span>
          <span class="stat-val">${group.count} 次${group.errors ? `（错 ${group.errors}）` : ''}</span>
        </div>`;
    })
    .join('');
}

function addRun(entry) {
  runs = pushRecord(runs, entry);
  saveRecords(localStorage, runs);
  renderRuns();
}

el.exportRuns.addEventListener('click', () => {
  const blob = new Blob([serialize(runs)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `运行记录-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(url);
});

el.clearRuns.addEventListener('click', () => {
  clearAll(localStorage);
  runs = [];
  renderRuns();
});

/* ---------------- 知识图谱侧边栏 ---------------- */

function renderKnowledgeGraph() {
  el.kg.innerHTML = '';
  categories.forEach((cat) => {
    const group = document.createElement('div');
    group.className = 'kg-group';

    const title = document.createElement('div');
    title.className = 'kg-cat';
    title.textContent = cat.name;
    group.appendChild(title);

    cat.nodes.forEach((node) => {
      const btn = document.createElement('button');
      btn.className = 'kg-node';
      btn.dataset.id = node.id;
      btn.innerHTML = `<span class="dot"></span><span>${node.name}</span><span class="pct">${node.mastery}</span>`;
      btn.addEventListener('click', () => onKnowledgePointClick(node));
      group.appendChild(btn);
    });

    el.kg.appendChild(group);
  });
  markActiveKnowledgePoint();
}

function markActiveKnowledgePoint() {
  el.kg.querySelectorAll('.kg-node').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.id === currentAlgo.kp);
    const node = nodeById.get(btn.dataset.id);
    btn.classList.toggle('done', Boolean(node && node.mastery >= 80));
  });
}

function onKnowledgePointClick(node) {
  const algo = findByKnowledgePoint(node.id);
  if (algo) {
    currentAlgo = algo;
    el.select.value = algo.id;
    build();
    markActiveKnowledgePoint();
    return;
  }
  el.note.textContent = `「${node.name}」的可视化模板正在建设中（计划第 2 阶段交付），当前先跑通排序类算法。`;
}

/* ---------------- 推荐 ---------------- */

function renderRecommend() {
  const { node, why } = recommend();
  el.recommend.innerHTML = `<div class="kp">${node.name}</div><div class="why">${node.category} · ${why}</div>`;
}

/* ---------------- 诊断 ---------------- */

const diagnosisView = createDiagnosisView(el.diagnosis);

async function runDiagnosis() {
  const code = el.code.value;
  if (!code.trim()) {
    diagnosisView.error('先把代码粘进上面的输入框。');
    return;
  }

  el.diagnoseBtn.disabled = true;
  diagnosisView.loading();

  try {
    const llm = await diagnoseWithLLM({
      code,
      algorithm: currentAlgo.name,
      language: 'C++'
    });

    if (llm.ok) {
      diagnosisView.show({ result: llm.result, source: 'llm', meta: llm.meta });
    } else {
      // 关键降级路径：模型不可用时，本地规则接管，界面照常给出结论
      diagnosisView.show({
        result: diagnose(code),
        source: 'rules',
        fallback: llm
      });
    }
  } finally {
    el.diagnoseBtn.disabled = false;
  }
}

el.diagnoseBtn.addEventListener('click', runDiagnosis);

el.healthBtn.addEventListener('click', async () => {
  el.health.textContent = '正在测试连接…';
  const health = await checkHealth(true);

  if (!health.ok) {
    el.health.className = 'health bad';
    el.health.textContent = `连接失败：${explainFailure(health)}`;
    return;
  }

  const d = health.data;
  el.health.className = d.key_configured && !String(d.probe || '').startsWith('失败') ? 'health good' : 'health bad';
  el.health.innerHTML = [
    `服务 v${d.version} · 模型 ${d.model}`,
    `Key：${d.key_configured ? d.key_masked : '未配置'}`,
    `.env：${d.env_found ? '已找到' : '未找到'}`,
    d.probe ? `连接测试：${d.probe}` : ''
  ].filter(Boolean).join('<br>');
});

/* ---------------- 事件绑定 ---------------- */

el.regenerate.addEventListener('click', build);
el.prev.addEventListener('click', () => player.prev());
el.next.addEventListener('click', () => player.next());
el.play.addEventListener('click', () => player.toggle());
el.speed.addEventListener('input', () => player.setSpeed(el.speed.value));
el.progress.addEventListener('input', () => {
  player.pause();
  player.seek(el.progress.value);
});

document.addEventListener('keydown', (event) => {
  if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
  if (event.code === 'Space') {
    event.preventDefault();
    player.toggle();
  }
  if (event.code === 'ArrowRight') player.next();
  if (event.code === 'ArrowLeft') player.prev();
});

/* ---------------- 结束时的“成长”反馈（演示） ---------------- */

let lastEndIndex = -1;
setInterval(() => {
  if (player.atEnd && player.total > 0 && lastEndIndex !== player.index) {
    lastEndIndex = player.index;
    mastery.bump('fix', 1);
    mastery.bump('coverage', 1);
    const node = nodeById.get(currentAlgo.kp);
    if (node) node.mastery = Math.min(100, node.mastery + 2);
    markActiveKnowledgePoint();
    renderRecommend();
  }
}, 600);

/* ---------------- 启动 ---------------- */

renderKnowledgeGraph();
renderRecommend();
renderRuns();
build();
diagnosisView.show({
  result: diagnose('int a[10]; for (int i = 0; i <= n; i++) { a[i] = 0; }'),
  source: 'rules'
});
return {  };
})();
</script>
